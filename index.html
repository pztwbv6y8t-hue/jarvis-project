<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JARVIS</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      margin-top: 150px;
    }
    h1 {
      font-size: 40px;
      letter-spacing: 8px;
      border-bottom: 1px solid #ffffff;
      display: inline-block;
      padding-bottom: 10px;
    }
    p {
      margin-top: 20px;
      letter-spacing: 4px;
      color: #cccccc;
    }
  .circle {
  width: 150px;
  height: 150px;
  border: 2px solid #ffffff;
  border-radius: 50%;
  margin: 40px auto;
  animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.1);
    opacity: 0.5;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
.talk-button {
  margin: 40px auto 0;
  padding: 15px 30px;
  background-color: transparent;
  border: 1px solid #ffffff;
  border-radius: 30px;
  color: #ffffff;
  font-size: 18px;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.chat-box {
  max-width: 400px;
  margin: 40px auto 0;
  text-align: left;
  max-height: 300;
  overflow-y: auto;
}
.message {
  padding: 10px 16px;
  border-radius: 16px;
  margin-bottom: 12px;
  font-size: 15px;
  max-width: 75%;
  line-height: 1.4;
}
.message.jarvis {
  background-color: #1a1a1a;
  border: 1px solid #444;
  color: #ffffff;
}
.message.user {
  background-color: #ffffff;
  color: #000000;
  margin-left: auto;
}
.boot-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #000000;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  letter-spacing: 4px;
  z-index: 999;
  animation: bootFade 2.5s forwards;
}

@keyframes bootFade {
  0% {
    opacity: 1;
  }
  70% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    visibility: hidden;
  }
}
#settingsToggle {
  display: none;
}
.settings-button {
  position: fixed;
  top: 20px;
  right: 20px;
  font-size: 24px;
  z-index: 1000;
}
.settings-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 250px;
  height: 100%;
  background-color: #111111;
  border-left: 1px solid #444;
  padding: 20px;
  color: #ffffff;
  text-align: left;
  transform: translateX(100%);
  transition: transform 0.3s ease-in-out;
  z-index: 998;
}
#settingsToggle:checked ~ .settings-panel {
  transform: translateX(0);
}


</style>
</head>
<body>
  <input type="checkbox" id="settingsToggle">
<label for="settingsToggle" class="settings-button">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 2v3M12 19v3M22 12h-3M5 12H2M19.07 4.93l-2.12 2.12M7.05 16.95l-2.12 2.12M19.07 19.07l-2.12-2.12M7.05 7.05L4.93 4.93" stroke-linecap="round"/>
  </svg>
</label>


  <div class="boot-screen">SYSTEM BOOTING...</div>

 <h1>J.A.R.V.I.S.</h1>
 <div class="circle"></div>
 <p>SYSTEM READY</p>
 <button class="talk-button">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
    <rect x="9" y="2" width="6" height="12" rx="3" fill="#ffffff"/>
    <path d="M5 11a7 7 0 0 0 14 0" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="12" y1="18" x2="12" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="22" x2="15" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </svg>
  TALK
</button>

<div class="chat-box">
  <div class="message jarvis">システム起動。何かご用でしょうか？</div>
</div>

<div class="settings-panel">
  <h3>設定</h3>
  <p>ここに今後、設定項目が追加されます。</p>
</div>

<script type="module">
  import { CreateMLCEngine } from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm";

  const talkButton = document.querySelector('.talk-button');
  const chatBox = document.querySelector('.chat-box');
  const circle = document.querySelector('.circle');
  const statusText = document.querySelector('p');

  let engine;
  const systemPrompt = "あなたはJARVISという執事AIです。丁寧に、簡潔に答えてください。";

  // 会話履歴を保存する関数
  function saveChatHistory() {
    localStorage.setItem('jarvis_chat', chatBox.innerHTML);
  }

  // 会話履歴を復元する関数
  function loadChatHistory() {
    const savedChat = localStorage.getItem('jarvis_chat');
    if (savedChat) {
      chatBox.innerHTML = savedChat;
    }
  }

  // 音声読み上げ関数
  function speak(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ja-JP';
    speechSynthesis.speak(utterance);
  }

  // 音声認識の設定
  const recognition = new webkitSpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = false;
  recognition.interimResults = false;

  // ビジュアライザー
  let audioContext, analyser, dataArray, animationId;

  function startVisualizer(stream) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    const micSource = audioContext.createMediaStreamSource(stream);
    micSource.connect(analyser);
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    circle.style.animation = 'none';
    updateVisualizer();
  }

  function updateVisualizer() {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i];
    }
    const average = sum / dataArray.length;
    const scale = 1 + (average / 100);
    circle.style.transform = 'scale(' + scale + ')';
    animationId = requestAnimationFrame(updateVisualizer);
  }

  function stopVisualizer() {
    if (animationId) cancelAnimationFrame(animationId);
    circle.style.transform = '';
    circle.style.animation = 'pulse 2s infinite ease-in-out';
    if (audioContext) audioContext.close();
  }

  // AIモデルの読み込み
  async function loadAI() {
    statusText.textContent = 'AI読み込み中...';
    try {
      engine = await CreateMLCEngine(
        "Llama-3.2-1B-Instruct-q4f16_1-MLC",
        {
          initProgressCallback: (progress) => {
            statusText.textContent = 'AI読み込み中... ' + Math.floor(progress.progress * 100) + '%';
          }
        }
      );
      statusText.textContent = 'SYSTEM READY';
    } catch (e) {
      statusText.textContent = 'AI読み込みエラー';
      alert('読み込みエラー詳細: ' + e.message);
    }
  }

  // AIへの質問処理
  async function askAI(userText) {
    if (!engine) return;
    statusText.textContent = '考え中...';
    try {
      const response = await engine.chat.completions.create({
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: userText }
        ]
      });
      const replyText = response.choices[0].message.content;
      
      const jarvisMessage = document.createElement('div');
      jarvisMessage.className = 'message jarvis';
      jarvisMessage.textContent = replyText;
      chatBox.appendChild(jarvisMessage);
      
      
      saveChatHistory(); // JARVISの返答後に記憶を保存
      speak(replyText);
    } catch (e) {
      alert('AI応答エラー: ' + e.message);
    }
    statusText.textContent = 'SYSTEM READY';
  }

  // イベント設定
  talkButton.addEventListener('click', function() {
    recognition.start();
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
      startVisualizer(stream);
    });
  });

  recognition.addEventListener('result', function(event) {
    const spokenText = event.results[0][0].transcript;
    const userMessage = document.createElement('div');
    userMessage.className = 'message user';
    userMessage.textContent = spokenText;
    chatBox.appendChild(userMessage);
    chatBox.scrollTop = chatBox.scrollHeight;
    
    saveChatHistory(); // ユーザーの発言後に記憶を保存
    askAI(spokenText);
  });

  recognition.addEventListener('end', function() {
    stopVisualizer();
  });

  // 起動時の処理
  loadChatHistory(); // 保存された会話を読み込む
  loadAI();
</script>

</body>
</html>
