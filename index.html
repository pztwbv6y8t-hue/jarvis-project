<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JARVIS</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: sans-serif;
      text-align: center;
      margin-top: 150px;
    }
    h1 {
      font-size: 40px;
      letter-spacing: 8px;
      border-bottom: 1px solid #ffffff;
      display: inline-block;
      padding-bottom: 10px;
    }
    p {
      margin-top: 20px;
      letter-spacing: 4px;
      color: #cccccc;
    }
  .circle {
  width: 150px;
  height: 150px;
  border: 2px solid #ffffff;
  border-radius: 50%;
  margin: 40px auto;
  animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.1);
    opacity: 0.5;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}
.talk-button {
  margin-top: 40px;
  padding: 15px 30px;
  background-color: transparent;
  border: 1px solid #ffffff;
  border-radius: 30px;
  color: #ffffff;
  font-size: 18px;
  letter-spacing: 2px;
}

</style>
</head>
<body>
  <h1>J.A.R.V.I.S.</h1>
<div class="circle"></div>
<p>SYSTEM READY</p>
<h1>J.A.R.V.I.S.</h1>
<div class="circle"></div>
<p>SYSTEM READY</p>
<button class="talk-button">🎙️ TALK</button>

</body>
</html>
